[project]
name = "industry-analysis"
version = "0.1.0"
description = "Industry research workspace tools and templates."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
video-youtube = [
    "youtube-transcript-api",
]
video-ytdlp = [
    "yt-dlp",
]
video-whisper-api = [
    "audioop-lts; python_version >= '3.13'",
    "openai",
    "pydub",
]
video-whisper-local = [
    "faster-whisper",
]
video-frames = [
    "pillow",
]
pdf-docling = [
    "docling",
]
pdf-pymupdf = [
    "pymupdf>=1.27.2.3",
    "pymupdf4llm>=1.27.2.3",
]

[tool.uv]
package = false
